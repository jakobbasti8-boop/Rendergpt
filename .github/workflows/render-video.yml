name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    paths:
      - render-requests/current.json
      - src/**
      - package.json
      - tsconfig.json

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Render video
        run: npm run render
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
